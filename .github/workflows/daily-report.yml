name: Daily Portfolio Report

on:
  schedule:
    # 05:00 UTC = 08:00 IDT (UTC+3), ימי חול בלבד
    - cron: '0 5 * * 1-5'
  workflow_dispatch:   # הרצה ידנית מה-GitHub UI

jobs:
  send-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # send_report.py now publishes (and verifies the Pages URL is live) before
      # emailing, so the link in the email can never point at a 404.
      # WhatsApp is skipped here — the bridge only runs on Meir's Mac.
      - name: Generate, publish & send report
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python send_report.py --no-whatsapp
